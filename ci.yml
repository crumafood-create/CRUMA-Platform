name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v$(tr -d '\n\r' < .nvmrc)"
          test "$(pnpm --version)" = "10.34.5"

      - name: Reject non-canonical lockfiles
        shell: bash
        run: |
          test -f pnpm-lock.yaml
          forbidden="$(find . -type f \
            \( -name package-lock.json -o -name yarn.lock -o -name bun.lock -o -name bun.lockb \) \
            -not -path './node_modules/*' -not -path './.git/*' -print -quit)"
          test -z "$forbidden"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify Supabase CLI
        shell: bash
        run: test "$(pnpm exec supabase --version)" = "2.109.1"

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
