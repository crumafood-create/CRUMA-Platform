name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v$(tr -d '\n\r' < .nvmrc)"
          test "$(pnpm --version)" = "10.34.5"

      - name: Reject non-canonical lockfiles
        shell: bash
        run: |
          test -f pnpm-lock.yaml
          forbidden="$(find . -type f \
            \( -name package-lock.json -o -name yarn.lock -o -name bun.lock -o -name bun.lockb \) \
            -not -path './node_modules/*' -not -path './.git/*' -print -quit)"
          test -z "$forbidden"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Supabase CLI
        shell: bash
        run: |
          actual_version="$(pnpm exec supabase --version)"
          expected_version="2.109.1"

          echo "Supabase CLI: ${actual_version}"
          test "${actual_version}" = "${expected_version}"

      - name: Create local Supabase network
        shell: bash
        run: |
          docker network create \
            -o 'com.docker.network.bridge.host_binding_ipv4=127.0.0.1' \
            cruma-supabase-local

      - name: Start local Supabase
        shell: bash
        run: |
          if ! pnpm exec supabase start \
            --network-id cruma-supabase-local \
            -x vector,logflare \
            > /tmp/supabase-start.log 2>&1
          then
            echo "Supabase local failed to start."
            exit 1
          fi

          echo "Supabase local started successfully."

      - name: Verify database baseline and security
        run: pnpm db:verify

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: pnpm exec supabase stop --no-backup || true

  storybook:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Reject snapshot updates in CI
        shell: bash
        run: |
          expected_command="playwright test --config=playwright.visual.config.ts"
          actual_command="$(node -p "require('./package.json').scripts['storybook:test:visual']")"

          test "$actual_command" = "$expected_command"

          update_flag="--update""-snapshots"
          update_script="storybook:update""-visual"

          if grep -RInE             --include='*.yml'             --include='*.yaml'             "(run:.*${update_flag}|run:.*${update_script}|pnpm (run )?${update_script})"             .github/workflows
          then
            echo "CI must not update visual baselines."
            exit 1
          fi

          echo "CI only compares committed visual baselines."

      - name: Test Storybook
        run: pnpm run test:storybook

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Test visual baselines
        id: visual
        continue-on-error: true
        run: pnpm run storybook:test:visual

      - name: Scan visual artifacts for secrets
        id: artifact_scan
        if: steps.visual.outcome == 'failure'
        shell: bash
        run: |
          artifact_paths=(
            test-results/visual-storybook
            playwright-report/visual-storybook
          )

          existing=()

          for path in "${artifact_paths[@]}"; do
            if test -e "$path"; then
              existing+=("$path")
            fi
          done

          if test "${#existing[@]}" -eq 0; then
            echo "No visual artifacts were generated."
            exit 0
          fi

          forbidden_pattern='(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_ANON_KEY|DATABASE_URL|POSTGRES_PASSWORD|JWT_SECRET|PRIVATE_KEY|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+)'

          if grep -RInE \
            --binary-files=without-match \
            "$forbidden_pattern" \
            "${existing[@]}"
          then
            echo "Potential secret detected in visual artifacts."
            exit 1
          fi

          echo "No configured secret patterns found in visual artifacts."

      - name: Upload visual failure artifacts
        if: >-
          always() &&
          steps.visual.outcome == 'failure' &&
          steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-visual-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/visual-storybook
            playwright-report/visual-storybook
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail on visual regression
        if: always() && steps.visual.outcome == 'failure'
        shell: bash
        run: |
          echo "Visual baseline comparison failed."
          exit 1
